name: Sync from AUR

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时同步一次
  workflow_dispatch:     
  

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge from AUR
        run: |
          chmod +x ./sync.sh
          ./sync.sh
          
